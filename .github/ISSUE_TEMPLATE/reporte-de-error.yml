name: Reporte de error
description: Algo de TikGO no hace lo que dice.
title: "[Error] "
labels: ["error", "sin revisar"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **No pegues claves, sesiones, tokens ni nombres de tu audiencia**: este issue es público.
  - type: input
    id: version
    attributes:
      label: Versión de TikGO
      description: Se ve en Ajustes.
      placeholder: "0.15.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: seccion
    attributes:
      label: Sección
      options:
        - Conexión al live
        - Voz (TTS)
        - Sonidos
        - Acciones y Eventos
        - Juegos Interactivos
        - Metas
        - Superposiciones
        - Multimedia (Spotify o YouTube)
        - Catálogo (Temporizador, Puntos o Rueda)
        - Chatbot
        - Estadísticas
        - Privacidad
        - Minecraft
        - R.E.P.O.
        - GTA V
        - Instalador o arranque
        - Otra
    validations:
      required: true
  - type: dropdown
    id: en-vivo
    attributes:
      label: ¿Pasó durante un live?
      options:
        - Sí, en un live de verdad
        - No, probando sin transmitir
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Lo que viste, con el texto exacto de cualquier error. Inicio suele mostrarlo en "Cosas que atender".
    validations:
      required: true
  - type: textarea
    id: que-esperabas
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Abrir…
        2. Tocar…
        3. Ver que…
    validations:
      required: false
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o video
      description: Opcional. Tapa antes los nombres de tu audiencia.
    validations:
      required: false
